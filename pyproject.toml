# pyproject.toml - Python's own file for siglipv2.
#
# It pins the toolchain. `recipe.ps1 test` runs pytest, mypy, ruff check and ruff
# format, and every setting those four read is here. There are no task-runner
# sections: the recipe's verbs are the tasks.

[build-system]
# Pinned with a version, not a bare name: an unpinned backend changes what
# `recipe.ps1 build` produces without anyone editing this file.
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "siglipv2"
# This must equal $Version in recipe.ps1: `recipe.ps1 test` fails when they disagree.
version = "1.0.0"
description = "Console script that classifies an image zero-shot against text labels with the SigLIP 2 model."
readme = "README.md"
license = "MIT"
authors = [{ name = "Igors Volohovs" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    # What requirements.txt named before the lab, now pinned. PyPI's Windows wheels of
    # torch are the CPU build, so the runner never fetches a CUDA stack.
    "torch==2.11.0",
    "transformers==5.5.4",
    "pillow==12.2.0",
    "rich==15.0.0",
]

[dependency-groups]
# `uv run` installs this group by default, so test.yaml's Runner health step finds
# ruff, pytest and mypy through `uv run --frozen <tool> --version`.
dev = [
    "ruff==0.16.1",
    "mypy==2.3.0",
    "pytest==8.4.2",
    "pytest-cov==5.0.0",
    "coverage==7.15.2",
]

[tool.setuptools]
py-modules = ["classify_siglip"]

[tool.uv]
# The tests and `recipe.ps1 run` use the source tree, so uv does not install the project.
package = false

[tool.ruff]
# Ruff refuses to run at all when its own version is not this one.
required-version = "0.16.1"
target-version = "py313"
line-length = 100
# Vendored agent tooling is not this project's code. Section 7 prints .claude/,
# tests/manual/serve.py and tools/wiki.py verbatim, so neither the linter nor the
# formatter may touch them.
extend-exclude = [".agent", ".claude", "tests/manual/serve.py", "tools/wiki.py"]

[tool.ruff.lint]
# BLE because classify_siglip.py marks its one broad handler with `noqa: BLE001`.
select = ["E", "W", "F", "I", "UP", "B", "BLE", "SIM", "C90", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "C90"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
# The floor is the whole number below the 95.65% the suite measures on adoption.
addopts = "-q --strict-markers --cov --cov-report=term --cov-fail-under=95"

[tool.coverage.run]
# The one script is this repository's own code; nothing of it is omitted.
source = ["."]
branch = true
omit = ["tests/*", "tools/*", ".agent/*", ".claude/*", ".venv/*", "build/*", "dist/*"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.13"
files = ["classify_siglip.py", "tools"]
strict = true
# THE SILENCE LIST, measured on adoption: it only ever gets shorter (R-12).
# One entry: AutoProcessor.from_pretrained has no annotations in transformers 5.5.4, and
# calling it is all classify_siglip.py does with it. Nothing is ignore_missing_imports.
untyped_calls_exclude = ["transformers"]
